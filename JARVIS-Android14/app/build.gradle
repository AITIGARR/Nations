plugins {
    id 'com.android.application'
}
android {
    namespace 'com.horizon.jarvis'
    compileSdk 35
    defaultConfig {
        applicationId 'com.horizon.jarvis'
        minSdk 26
        targetSdk 34
        ndk { abiFilters 'arm64-v8a' }
        versionCode 5
        versionName '0.4.1'
    }
    ndkVersion '27.2.12479018'
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    androidResources {
        noCompress += ['gguf']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
