plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.horizon.jarvis'
    compileSdk 35
    defaultConfig {
        applicationId 'com.horizon.jarvis'
        minSdk 26
        targetSdk 34
        ndk { abiFilters 'arm64-v8a' }
        versionCode 10
        versionName '0.9.0'
    }
    ndkVersion '27.2.12479018'
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    androidResources {
        noCompress += ['gguf']
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    def signingPath = System.getenv("JARVIS_KEYSTORE_PATH")
    if (signingPath != null && file(signingPath).exists()) {
        signingConfigs {
            stable {
                storeFile file(signingPath)
                storePassword System.getenv("JARVIS_STORE_PASSWORD")
                keyAlias System.getenv("JARVIS_KEY_ALIAS") ?: "jarvis"
                keyPassword System.getenv("JARVIS_KEY_PASSWORD")
            }
        }
        buildTypes {
            debug {
                signingConfig signingConfigs.stable
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files('libs/sherpa-onnx-1.13.8.aar')
    testImplementation 'junit:junit:4.13.2'
}
