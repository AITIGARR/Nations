name: Build JARVIS Android 14 APK
on:
  push:
    branches:
      - jarvis-android14
    paths:
      - 'JARVIS-Android14/**'
      - '.github/workflows/jarvis-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: JARVIS-Android14
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android14-debug-apk
          path: JARVIS-Android14/app/build/outputs/apk/debug/app-debug.apk
