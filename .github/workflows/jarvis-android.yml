name: Build JARVIS Android 14 APK
on:
  push:
    branches:
      - jarvis-android14
    paths:
      - 'JARVIS-Android14/**'
      - '.github/workflows/jarvis-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Prepare pinned llama.cpp runtime
        run: |
          DIR=JARVIS-Android14/app/src/main/cpp/llama.cpp
          mkdir -p "$DIR"
          git -C "$DIR" init
          git -C "$DIR" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$DIR" fetch --depth 1 origin 23b0202a189c44a54625aadcb37a946dd1d6278d
          git -C "$DIR" checkout --detach FETCH_HEAD
      - name: Download Qwen2.5 0.5B offline GGUF (Apache-2.0)
        run: |
          set -euo pipefail
          mkdir -p JARVIS-Android14/app/src/main/assets
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 30 --max-time 600 \
            'https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf?download=true' \
            -o JARVIS-Android14/app/src/main/assets/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf
          python3 - <<'PY'
          import os
          name = 'JARVIS-Android14/app/src/main/assets/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf'
          size = os.path.getsize(name)
          assert 350_000_000 < size < 455_000_000, f'invalid GGUF size: {size}'
          with open(name, 'rb') as file:
              assert file.read(4) == b'GGUF'
          print('Bundled Qwen2.5 model verified:', size, 'bytes')
          PY
      - name: Add offline Russian voice assets (Piper Dmitri int8)
        run: |
          set -euo pipefail
          mkdir -p JARVIS-Android14/app/src/main/assets/piper JARVIS-Android14/app/libs /tmp/piper-extract
          curl -fL --retry 3 --connect-timeout 25 --max-time 300 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-ru_RU-dmitri-medium-int8.tar.bz2 \
            -o /tmp/piper-dmitri.tar.bz2
          tar -xjf /tmp/piper-dmitri.tar.bz2 -C /tmp/piper-extract
          MODEL=$(find /tmp/piper-extract -type f -name '*.onnx' -print -quit)
          test -n "$MODEL"
          cp -a "$(dirname "$MODEL")/." JARVIS-Android14/app/src/main/assets/piper/
          test -f JARVIS-Android14/app/src/main/assets/piper/tokens.txt
          test -d JARVIS-Android14/app/src/main/assets/piper/espeak-ng-data
          curl -fL --retry 3 --connect-timeout 25 --max-time 300 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar \
            -o JARVIS-Android14/app/libs/sherpa-onnx-1.13.8.aar
          unzip -t JARVIS-Android14/app/libs/sherpa-onnx-1.13.8.aar > /dev/null
      - name: Optional stable app signing from repository secrets
        env:
          JARVIS_KEYSTORE_BASE64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
          JARVIS_STORE_PASSWORD: ${{ secrets.JARVIS_STORE_PASSWORD }}
          JARVIS_KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
          JARVIS_KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
        run: |
          if [ -n "$JARVIS_KEYSTORE_BASE64" ] && [ -n "$JARVIS_STORE_PASSWORD" ] && [ -n "$JARVIS_KEY_PASSWORD" ]; then
            printf '%s' "$JARVIS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jarvis-stable.jks"
            echo "JARVIS_KEYSTORE_PATH=$RUNNER_TEMP/jarvis-stable.jks" >> "$GITHUB_ENV"
            echo "JARVIS_STORE_PASSWORD=$JARVIS_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "JARVIS_KEY_PASSWORD=$JARVIS_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "JARVIS_KEY_ALIAS=${JARVIS_KEY_ALIAS:-jarvis}" >> "$GITHUB_ENV"
            echo "Using user-provided stable signing key"
          else
            echo "::warning::No stable signing secrets. Debug APK will use an ephemeral key and may not upgrade previous versions."
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: JARVIS-Android14
        run: gradle --no-daemon --max-workers=2 testDebugUnitTest assembleDebug
      - name: Verify signing certificate
        run: |
          APK=JARVIS-Android14/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android14-debug-apk
          path: JARVIS-Android14/app/build/outputs/apk/debug/app-debug.apk
