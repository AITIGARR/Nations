name: Horizon Rust Android - rebuild launcher (reuse engine)
on:
  push:
    branches: [horizon-android-build-test]
    paths:
      - 'android-app/**'
      - '.github/workflows/horizon-android-quick.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/download-artifact@v4
        with:
          name: Horizon-Rust-Android-APK
          run-id: 40788286826
          github-token: ${{ github.token }}
          path: original
      - name: Recover verified ARM64 Rust game engine
        run: |
          test -s original/app-debug.apk
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a
          unzip -p original/app-debug.apk lib/arm64-v8a/libhorizon_client.so > android-app/app/src/main/jniLibs/arm64-v8a/libhorizon_client.so
          test -s android-app/app/src/main/jniLibs/arm64-v8a/libhorizon_client.so
          file android-app/app/src/main/jniLibs/arm64-v8a/libhorizon_client.so
      - name: Build version-aware Android APK
        run: |
          cd android-app
          gradle :app:assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libhorizon_client.so'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-Rust-Android-Version-Library-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
